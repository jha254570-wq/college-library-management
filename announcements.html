{% extends 'base.html' %}{% block content %}<h1>Announcements</h1>{% if can_post %}<div class="card"><form method="post" class="form-grid"><label>Title<input name="title"></label><label>Priority<select name="priority"><option>Normal</option><option>Important</option><option>Urgent</option></select></label><label>Message<textarea name="message" rows="3"></textarea></label><button class="primary">PUBLISH NOTICE</button></form></div>{% endif %}<div class="cards">{% for a in rows %}<div class="book-card"><span class="badge">{{a.priority}}</span><h3>{{a.title}}</h3><p>{{a.message}}</p><small>{{a.created_at}} · {{a.created_by}}</small></div>{% endfor %}</div>{% endblock %}
