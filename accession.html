{% extends 'base.html' %}{% block content %}<h1>Accession Register</h1><div class="card"><form method="post" class="form-grid"><label>Accession No.<input name="accession_no" required></label><label>Book<select name="book_id">{% for b in books %}<option value="{{b.book_id}}">{{b.book_id}} - {{b.title}}</option>{% endfor %}</select></label><label>ISBN<input name="isbn"></label><label>Edition<input name="edition"></label><label>Publisher<input name="publisher"></label><label>Purchase Date<input name="purchase_date" type="date"></label><label>Price<input name="price" type="number" step="0.01"></label><label>Rack<input name="rack"></label><label>Shelf<input name="shelf"></label><label>Condition<select name="condition_status"><option>Good</option><option>Damaged</option><option>Lost</option></select></label><label>Branch<input name="branch" value="Main Library"></label><button class="primary">SAVE ACCESSION</button></form></div><div class="card"><table><tr><th>Accession</th><th>Book</th><th>ISBN</th><th>Edition</th><th>Rack</th><th>Branch</th><th>Condition</th></tr>{% for r in rows %}<tr><td>{{r.accession_no}}</td><td>{{r.book_id}}</td><td>{{r.isbn}}</td><td>{{r.edition}}</td><td>{{r.rack}} / {{r.shelf}}</td><td>{{r.branch}}</td><td>{{r.condition_status}}</td></tr>{% endfor %}</table></div>{% endblock %}
