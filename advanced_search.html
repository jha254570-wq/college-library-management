{% extends 'base.html' %}{% block content %}<h1>Advanced Book Search</h1><div class="card"><form class="form-grid"><label>Search<input name="q"></label><label>ISBN<input name="isbn"></label><label>Publisher<input name="publisher"></label><label>Rack<input name="rack"></label><label>Status<select name="status"><option>All</option><option>Available</option><option>Issued</option><option>Archived</option></select></label><button class="primary">SEARCH</button></form></div><div class="card"><table><tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Publisher</th><th>Rack</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.book_id}}</td><td>{{r.title}}</td><td>{{r.author}}</td><td>{{r.isbn}}</td><td>{{r.publisher}}</td><td>{{r.rack}} / {{r.shelf}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
