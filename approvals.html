{% extends 'base.html' %}{% block content %}<h1>Approval Workflow</h1><div class="card"><table><tr><th>ID</th><th>Type</th><th>Ref</th><th>Requested By</th><th>Reason</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.request_id}}</td><td>{{r.request_type}}</td><td>{{r.reference_id}}</td><td>{{r.requested_by}}</td><td>{{r.reason}}</td><td>{{r.status}}</td><td><form method="post"><input type="hidden" name="request_id" value="{{r.request_id}}"><select name="status"><option>Approved</option><option>Rejected</option></select><button>Update</button></form></td></tr>{% endfor %}</table></div><div class="card"><h2>Create Request</h2><form method="post" action="{{url_for('approval_request')}}" class="form-grid"><label>Type<input name="request_type"></label><label>Reference<input name="reference_id"></label><label>Reason<input name="reason"></label><button class="primary">SUBMIT</button></form></div>{% endblock %}
